<body>

<main id="main">
<section style="min-height:100vh;display:flex;align-items:center;padding:60px 0;background:
    radial-gradient(60% 60% at 85% 15%, rgba(255,168,182,.4), transparent 60%),
    radial-gradient(50% 50% at 10% 90%, rgba(39,211,195,.3), transparent 60%),
    var(--sf-bg)">
<div class="container text-center">
  <a class="sf-brand mb-4 d-inline-flex" href="index.html"><span class="flame"><i class="ri-fire-fill"></i></span> StreetFlame</a>

    <div class="cd"><div class="num" data-h>00</div><div class="lbl">Hours</div></div>

    <div class="d-flex gap-2">
      <input type="email" class="form-control" placeholder="you@email.com" required>
      <button class="btn-sf-primary" type="submit">Notify Me</button>
    </div>
  </form>
